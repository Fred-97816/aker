<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Dark rounded-square background -->
  <rect width="100" height="100" rx="18" ry="18" fill="#0F1117"/>

  <!--
    Stylized glass bottle silhouette — container/wine bottle profile.
    Centered horizontally. Single filled path for crispness at small sizes.
    Gold/amber fill: #C8A96E
  -->
  <path
    d="
      M 46,12
      L 46,14
      Q 44,14 43,16
      L 42,22
      Q 38,28 37,36
      L 36,42
      Q 34,44 34,48
      L 34,78
      Q 34,82 38,83
      L 62,83
      Q 66,82 66,78
      L 66,48
      Q 66,44 64,42
      L 63,36
      Q 62,28 58,22
      L 57,16
      Q 56,14 54,14
      L 54,12
      Z
    "
    fill="#C8A96E"
  />

  <!-- Subtle highlight: thin vertical reflection line on bottle body -->
  <line x1="43" y1="48" x2="43" y2="76" stroke="#E8D4A8" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
</svg>
